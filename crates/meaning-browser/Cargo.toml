[package]
name = "meaning-browser"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Browser host for Meaning language intelligence"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
allocation-metrics = []

[dependencies]
meaning-parser={path="../meaning-parser"}
meaning-formatter={path="../meaning-formatter",features=["serde"]}
meaning-protocol = { path = "../meaning-protocol" }
meaning-analysis = { path = "../meaning-analysis" }
serde = { workspace = true, features = ["derive"] }
lsp-types = { workspace = true, features = ["fluent-uri"] }
serde_json = { workspace = true }
wasm-bindgen = { workspace = true }
