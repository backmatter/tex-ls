name: Release automation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  release:
    name: Create tag and draft release
    if: github.repository == 'backmatter/tex-ls'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      released: ${{ steps.release.outputs.releases_created }}
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ github.token }}

      - name: Check synchronized versions
        run: python3 scripts/sync_release_versions.py

      - name: Release merged release PR
        id: release
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
          version: 0.3.167
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build release assets
        if: steps.release.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASES: ${{ steps.release.outputs.releases }}
        run: |
          tag=$(jq -er '.[] | select(.package_name == "tex-ls") | .tag' <<< "$RELEASES")
          gh workflow run binaries.yml --ref main -f "tag=$tag"

  release-pr:
    name: Prepare release PR
    needs: release
    if: github.repository == 'backmatter/tex-ls' && needs.release.outputs.released != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ github.token }}

      - name: Prepare release dependency resolution
        env:
          RELEASE_CARGO_HOME: ${{ runner.temp }}/release-cargo
        run: |
          python3 scripts/prepare_release_resolution.py --output "$RELEASE_CARGO_HOME/config.toml"
          echo "$RELEASE_CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Open or update release PR
        id: release-pr
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
          version: 0.3.167
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CARGO_HOME: ${{ runner.temp }}/release-cargo

      - name: Check out release PR
        if: steps.release-pr.outputs.prs_created == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(steps.release-pr.outputs.pr).head_branch }}
          token: ${{ github.token }}
          persist-credentials: true

      - name: Synchronize bundled extension
        if: steps.release-pr.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cargo update --workspace
          python3 scripts/sync_release_versions.py --write --changelog
          git add Cargo.lock editors/vscode/package.json editors/vscode/package-lock.json editors/vscode/CHANGELOG.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: synchronize extension with server release"
            git push
          fi

      - name: Mark synchronized release PR ready for review
        if: steps.release-pr.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR_NUMBER: ${{ fromJSON(steps.release-pr.outputs.pr).number }}
        run: |
          if [[ "$(gh pr view "$RELEASE_PR_NUMBER" --json isDraft --jq .isDraft)" == true ]]; then
            gh pr ready "$RELEASE_PR_NUMBER"
          fi

      - name: Check synchronized release PR
        if: steps.release-pr.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ fromJSON(steps.release-pr.outputs.pr).head_branch }}
        run: gh workflow run check.yml --ref "$RELEASE_BRANCH"
