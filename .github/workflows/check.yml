name: Check
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      release_pr:
        description: Synchronized release PR to validate or reuse its checked source
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Validation scope
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.action != 'edited')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check validation reuse boundaries
        run: python3 scripts/test_ci_scope.py
      - name: Verify whether the source already passed all platform checks
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RELEASE_PR: ${{ inputs.release_pr }}
        run: python3 scripts/ci-scope.py check.yml

  check:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked --no-fail-fast
      - run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: python3 scripts/sync_release_versions.py
      - run: python3 scripts/test_release_versions.py
      - run: python3 scripts/test_benchmark_lsp_rpc.py
      - run: python3 scripts/check_architecture.py
      - run: python3 scripts/test_installers.py
        if: runner.os != 'Windows'
      - run: python3 scripts/gen_cwl_signatures.py --selftest
      - run: python3 scripts/gen_math_symbols.py --selftest
      - run: python3 scripts/gen_package_names.py --selftest
      - if: runner.os == 'Linux'
        run: cargo build -p tex-ls-browser -p tex-ls-parser -p tex-ls-formatter --all-features --locked --target wasm32-unknown-unknown

  hosts:
    needs: scope
    if: ${{ always() && needs.scope.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require a valid validation decision
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
        run: test "$SCOPE_RESULT" = success
      - uses: actions/checkout@v7
        if: needs.scope.outputs.full == 'true'
      - uses: actions/setup-node@v7
        if: needs.scope.outputs.full == 'true'
        with:
          node-version: '24'
      - run: rustup toolchain install
        if: needs.scope.outputs.full == 'true'
      - uses: Swatinem/rust-cache@v2
        if: needs.scope.outputs.full == 'true'
      - uses: taiki-e/install-action@v2
        if: needs.scope.outputs.full == 'true'
        with:
          tool: wasm-bindgen-cli@0.2.128
      - run: bash scripts/check_host_parity.sh
        if: needs.scope.outputs.full == 'true'

  vscode:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        vscode-version: [stable]
        include:
          - os: ubuntu-latest
            vscode-version: 1.91.1
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --bin tex-ls
      - run: npm ci
        working-directory: editors/vscode
      - run: npm test
        working-directory: editors/vscode
      - name: Test in VS Code
        working-directory: editors/vscode
        shell: bash
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode-version }}
        run: |
          export TEX_LS_TEST_SERVER="$GITHUB_WORKSPACE/target/debug/tex-ls"
          if [[ "$RUNNER_OS" == Windows ]]; then TEX_LS_TEST_SERVER="$TEX_LS_TEST_SERVER.exe"; fi
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a npm run test:integration
          else
            npm run test:integration
          fi
      - name: Check VSIX packaging
        if: matrix.vscode-version == 'stable'
        working-directory: editors/vscode
        shell: bash
        run: |
          binary="../../target/debug/tex-ls"
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$binary.exe"; fi
          vscode_target=$(node -p 'process.platform + "-" + process.arch')
          node scripts/package.mjs --binary "$binary" --target "$vscode_target"
