name: PR title
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require a Conventional Commit title for squash merging
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PYTHON'
          import os, re
          title = os.environ["PR_TITLE"]
          if not re.fullmatch(r"(?:feat|fix|docs|perf|revert|chore|ci|build|refactor|style|test)(?:\([^\r\n()]+\))?!?: [^\r\n]+", title):
              raise SystemExit("Use a Conventional Commit PR title, for example: feat: support project-local builds")
          PYTHON

