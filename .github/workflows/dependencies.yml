name: Dependencies
on:
  pull_request:
    paths: ['**/Cargo.toml', '**/Cargo.lock', 'deny.toml', 'editors/vscode/package.json', 'editors/vscode/pnpm-lock.yaml', 'editors/vscode/pnpm-workspace.yaml', '.github/workflows/dependencies.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
  pnpm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: '26'
          working-directory: editors/vscode
          cache: true
          run-install: false
      - run: vp pm audit
