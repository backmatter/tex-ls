name: Dependencies
on:
  pull_request:
    paths: ['**/Cargo.toml', '**/Cargo.lock', 'deny.toml', '.github/workflows/dependencies.yml']
  push:
    branches: [main]
    paths: ['**/Cargo.toml', '**/Cargo.lock', 'deny.toml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
